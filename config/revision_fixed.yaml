# TMS-EDL Default Configuration
# Optimised for NIH Chest X-ray 14 (112k images, 15 multi-label classes)

seed: 42
device: "cuda"

# ── Data ──────────────────────────────────────────────
data:
  dataset: "nih_chestxray"          # nih_chestxray | camelyon16
  data_root: "data"
  image_size: 224
  hr_size: 560            # D8: crop_frac 0.4 x 560 = 224 px exactly (1:1 sampling)
  cache_dir: "data/nih_cache_768"   # pre-decoded source; removes PNG decode cost only
  num_workers: 12
  pin_memory: true

  # NIH Chest X-ray specific
  nih:
    csv_path: "data/NIH_Chest_Xray_Dataset/data/Data_Entry_2017_v2020.csv"
    image_dir: "data/NIH_Chest_Xray_Dataset/data/images/images"
    train_list: "data/NIH_Chest_Xray_Dataset/data/train_val_list.txt"
    test_list: "data/NIH_Chest_Xray_Dataset/data/test_list.txt"
    num_classes: 14              # 14 diseases; "No Finding" is DERIVED, not predicted (M1)
    multi_label: true
    drop_no_finding: true

  # Camelyon16 specific
  camelyon16:
    data_dir: "data/Camelyon16"
    patch_size: 256
    num_classes: 2
    multi_label: false

# ── Model ─────────────────────────────────────────────
model:
  # Global Expert (ViT)
  global_expert:
    backbone: "vit_base_patch16_224"
    pretrained: true
    embed_dim: 768

  # Local Expert (ResNet)
  local_expert:
    backbone: "resnet50"
    pretrained: true
    embed_dim: 2048
    use_attention_crop: true   # attention-based ROI cropping
    crop_size: 160             # local patch size for ROI cropping
    top_k_patches: 6           # top-k attention patches
    crop_frac: 0.4             # D8: each crop covers 40% of the image (was 71.4%)

  # Evidential head
  evidential:
    activation: "softplus"     # softplus | relu | exp
    mode: "beta"               # beta = per-label binary frames (M1 fix)
                               # dirichlet = original single categorical Dirichlet

  # Fusion
  fusion:
    method: "dempster_shafer"  # dempster_shafer | yager | cautious | average | gating
    learn_discount: false      # Shafer source discounting with learned r_s

# ── Training ──────────────────────────────────────────
training:
  epochs: 20
  batch_size: 40          # HR branch raises activation memory              # single GPU (GPU0), ~52 GB free
  gradient_accumulation: 1     # no accumulation needed at bs=48
  val_ratio: 0.1
  weighted_sampler: false     # imbalance handled in the loss only (D6 fix)

  optimizer:
    type: "AdamW"
    lr: 1.0e-4                 # head lr (evidential heads, fusion, projections)
    backbone_lr: 2.0e-5        # backbone lr (ViT encoder, ResNet encoder)
    weight_decay: 5.0e-4       # moderate regularisation

  scheduler:
    type: "cosine"
    warmup_epochs: 5
    min_lr: 1.0e-7

  loss:
    type: "edl"                # edl | ce
    kl_weight: 0.01            # KL divergence regulariser (reduced: kl_disabled ablation showed 0.05 was too strong)
    annealing_epochs: 10       # linearly anneal kl_weight over first 10 epochs

  mixed_precision: true
  gradient_clip: 1.0
  compile: false                 # torch.compile: set true for extra ~20% speed (first epoch slow)
  early_stopping_patience: 5

# ── Evaluation ────────────────────────────────────────
evaluation:
  metrics: ["auc", "acc", "ece", "ood_auroc"]
  ece_bins: 15
  ood_dataset: "imagenet_samples"  # for OOD detection test

# ── Logging ───────────────────────────────────────────
logging:
  output_dir: "outputs_fixed"
  log_interval: 100
  save_interval: 1          # save last.pth every epoch for resume
  use_wandb: false
  wandb_project: "tms-edl"
